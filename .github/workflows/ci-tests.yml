name: CI Tests & Omni-Broker Verification

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple --trusted-host opensource.tbank.ru
      - name: Run full test suite
        env:
          PYTHONPATH: backend
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
        run: pytest backend/tests -v

  kmp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run KMP unit tests
        working-directory: client-kmp
        run: gradle desktopTest
